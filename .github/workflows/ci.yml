# CI: lint, type-check, test, and build (runs on push/PR to main and dev).
# CD: production deploy only on push to main; preview deploy on push to dev.

name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    working-directory: OvalensPlanner

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OvalensPlanner/apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check app

      - name: Pytest
        run: uv run pytest tests -v --tb=short

  web:
    name: Web (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OvalensPlanner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: OvalensPlanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@helio/web

      - name: Type-check
        run: npx turbo run type-check --filter=@helio/web

      - name: Build
        run: npx turbo run build --filter=@helio/web
        env:
          # Build can need these; use dummies if not in GitHub env
          NEXT_PUBLIC_APP_URL: https://www.ovalens.com
          NEXT_PUBLIC_API_URL: https://ovalens-api.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}

  # Deployment: only on push to main (skipped on pull_request and other branches)
  deploy-api:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it in GitHub: Repository → Settings → Secrets and variables → Actions → New repository secret (name: VERCEL_TOKEN, value: token from https://vercel.com/account/tokens)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy API to Vercel
        working-directory: OvalensPlanner/apps/api
        run: vercel --prod --yes --name ovalens-api --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it in GitHub: Repository → Settings → Secrets and variables → Actions → New repository secret (name: VERCEL_TOKEN, value: token from https://vercel.com/account/tokens)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web to Vercel
        working-directory: OvalensPlanner
        run: vercel --prod --yes --name ovalens-web --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

  # Preview deployment: on push to dev (Vercel preview URLs, not production)
  deploy-api-preview:
    name: Deploy API (Preview)
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy API (Preview)
        working-directory: OvalensPlanner/apps/api
        run: vercel --yes --name ovalens-api --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

  deploy-web-preview:
    name: Deploy Web (Preview)
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Web (Preview)
        working-directory: OvalensPlanner
        run: vercel --yes --name ovalens-web --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
