# CI: lint, type-check, test, and build for API and Web.
# CD: connect this repo to Vercel (see docs/CI-CD.md) for automatic deploys on push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: OvalensPlanner

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OvalensPlanner/apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check app

      - name: Pytest
        run: uv run pytest tests -v --tb=short

  web:
    name: Web (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OvalensPlanner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: OvalensPlanner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@helio/web

      - name: Type-check
        run: npx turbo run type-check --filter=@helio/web

      - name: Build
        run: npx turbo run build --filter=@helio/web
        env:
          # Build can need these; use dummies if not in GitHub env
          NEXT_PUBLIC_APP_URL: https://www.ovalens.com
          NEXT_PUBLIC_API_URL: https://ovalens-api.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
